# Required GitLab CI/CD Variables (Settings -> CI/CD -> Variables):
# - VITE_FIREBASE_CONFIG : Full Firebase config JSON string
# - VITE_BASE_PATH       : e.g. /<repo-name>/ (or / for root domain)
# - GITHUB_TOKEN         : GitHub Fine-grained PAT (Contents: Read & Write)
# - GITHUB_REPO          : <github-user>/<repo-name>

image: node:22-alpine

stages:
  - build
  - deploy

build_app:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - if [ -f package-lock.json ]; then npm ci; else npm install; fi
    - |
      node -e '
        let raw = (process.env.VITE_FIREBASE_CONFIG || "").trim();
        if (!raw) {
          console.error("ERROR: VITE_FIREBASE_CONFIG CI variable is empty.");
          process.exit(1);
        }
        if ((raw.startsWith("\x27") && raw.endsWith("\x27")) || (raw.startsWith("`") && raw.endsWith("`"))) {
          raw = raw.slice(1, -1).trim();
        }
        let cfg;
        try {
          cfg = JSON.parse(raw);
          if (typeof cfg === "string") cfg = JSON.parse(cfg);
        } catch (e) {
          console.error("ERROR: VITE_FIREBASE_CONFIG is not valid JSON:", e.message);
          process.exit(1);
        }
        if (!cfg || !cfg.apiKey || !cfg.projectId || !cfg.appId) {
          console.error("ERROR: VITE_FIREBASE_CONFIG is missing required fields (apiKey, projectId, appId).");
          process.exit(1);
        }
      '
    - npm run build
    - cp dist/index.html dist/404.html
    - touch dist/.nojekyll
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour

deploy_github_pages:
  stage: deploy
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  needs:
    - build_app
  before_script:
    - apk add --no-cache git
  script:
    - cd dist
    - git init
    - git config user.name "GitLab CI"
    - git config user.email "ci@gitlab.local"
    - git add -A
    - git commit -m "Deploy to GitHub Pages ($CI_COMMIT_SHORT_SHA)"
    - git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git" HEAD:gh-pages
