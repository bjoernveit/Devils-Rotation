name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH || (github.event.repository.name == format('{0}.github.io', github.repository_owner) && '/' || format('/{0}/', github.event.repository.name)) }}
        run: |
          node -e '
            let raw = (process.env.VITE_FIREBASE_CONFIG || "").trim();
            if (!raw) {
              console.error("ERROR: VITE_FIREBASE_CONFIG secret is empty. Add it under Settings -> Environments -> github-pages -> Environment secrets or Repository secrets.");
              process.exit(1);
            }
            if ((raw.startsWith("\x27") && raw.endsWith("\x27")) || (raw.startsWith("`") && raw.endsWith("`"))) {
              raw = raw.slice(1, -1).trim();
            }
            let cfg;
            try {
              cfg = JSON.parse(raw);
              if (typeof cfg === "string") cfg = JSON.parse(cfg);
            } catch (e) {
              console.error("ERROR: VITE_FIREBASE_CONFIG is not valid JSON:", e.message);
              process.exit(1);
            }
            if (!cfg || !cfg.apiKey || !cfg.projectId || !cfg.appId) {
              console.error("ERROR: VITE_FIREBASE_CONFIG is missing required fields (apiKey, projectId, appId).");
              process.exit(1);
            }
          '
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
